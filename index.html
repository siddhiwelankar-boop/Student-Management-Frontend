
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- ADD STUDENT -->
        <div class="box">
            <h2>Add Student</h2>

            <input type="text" id="name" placeholder="Enter student name">

            <input type="text" id="course" placeholder="Enter course">

            <input type="number" id="marks" placeholder="Enter marks">

            <button onclick="addStudent()">Add Student</button>
        </div>


        <!-- SEARCH STUDENT -->
        <div class="box">
            <h2>Search Student</h2>

            <input type="number" id="searchId" placeholder="Enter Student ID">

            <button onclick="searchStudent()">Search</button>

            <div id="searchResult"></div>
        </div>


        <!-- VIEW ALL STUDENTS -->
        <div class="box">
            <h2>All Students</h2>

            <button onclick="getAllStudents()">View All Students</button>

            <div id="studentList"></div>
        </div>


        <!-- UPDATE STUDENT -->
        <div class="box">
            <h2>Update Student</h2>

            <input type="number" id="updateId" placeholder="Student ID">

            <input type="text" id="updateName" placeholder="New name">

            <input type="text" id="updateCourse" placeholder="New course">

            <input type="number" id="updateMarks" placeholder="New marks">

            <button onclick="updateStudent()">Update Student</button>
        </div>


        <!-- DELETE STUDENT -->
        <div class="box">
            <h2>Delete Student</h2>

            <input type="number" id="deleteId" placeholder="Enter Student ID">

            <button class="delete-button" onclick="deleteStudent()">
                Delete Student
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
